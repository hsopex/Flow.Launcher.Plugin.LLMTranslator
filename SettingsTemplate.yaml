#$schema: https://www.flowlauncher.com/schemas/settings-template.schema.json
body:
  - type: textBlock
    attributes:
      description: 'Quick start: type tt followed by text to preview a translation. Press Enter to send one API request.'

  - type: textBlock
    attributes:
      description: 'Examples: tt text · tt r text · tt ja>en text · tt @claude text · tt :set en zh-CN'

  - type: separator
    attributes:
      name: generalSeparator

  - type: textBlock
    attributes:
      description: General

  - type: dropdown
    attributes:
      name: defaultProfile
      label: Default API profile
      description: Used when a query does not start with @alias. Incomplete profiles show a setup prompt.
      defaultValue: Chat Completions
      options:
        - Chat Completions
        - Responses
        - Claude

  - type: dropdown
    attributes:
      name: translationMode
      label: Translation mode
      description: Smart bilingual translates Chinese to English and other languages to Simplified Chinese.
      defaultValue: Smart bilingual
      options:
        - Smart bilingual
        - Custom language pair

  - type: separator
    attributes:
      name: languageSeparator

  - type: textBlock
    attributes:
      description: Language direction

  - type: input
    attributes:
      name: sourceLanguage
      label: Source language
      description: Used by custom mode, tt r, and tt :set. Enter a language code or auto.
      defaultValue: en

  - type: input
    attributes:
      name: targetLanguage
      label: Target language
      description: Used by custom mode, tt r, and tt :set, for example zh-CN or ja.
      defaultValue: zh-CN

  - type: separator
    attributes:
      name: advancedSeparator

  - type: textBlock
    attributes:
      description: Advanced

  - type: input
    attributes:
      name: requestTimeoutSeconds
      label: Request timeout (seconds)
      description: 'Accepted range: 1-120. Default: 30.'
      defaultValue: "30"

  - type: input
    attributes:
      name: maxOutputTokens
      label: Maximum output tokens
      description: 'Used by Responses and Claude. Accepted range: 1-32768. Default: 2048.'
      defaultValue: "2048"

  - type: separator
    attributes:
      name: apiProfilesSeparator

  - type: textBlock
    attributes:
      description: API profiles

  - type: textBlock
    attributes:
      description: 'Each profile is configured independently. Select one per query with @alias. Built-in aliases: @chat, @responses, and @claude.'

  - type: separator
    attributes:
      name: chatSeparator

  - type: textBlock
    attributes:
      description: 'Chat Completions profile: POST /chat/completions · Authorization: Bearer'

  - type: input
    attributes:
      name: chatAlias
      label: Profile alias
      description: 'One word, up to 32 characters. Do not use spaces, @, or >.'
      defaultValue: chat

  - type: input
    attributes:
      name: chatBaseUrl
      label: Base URL
      description: 'Defaults to https://api.openai.com/v1. /chat/completions is appended only when needed.'
      defaultValue: https://api.openai.com/v1

  - type: passwordBox
    attributes:
      name: chatApiKey
      label: API key
      description: Stored in Flow Launcher settings. If empty, a query shows a setup prompt.
      defaultValue: ""

  - type: input
    attributes:
      name: chatModel
      label: Model ID
      description: Enter a model ID supported by your provider.
      defaultValue: ""

  - type: separator
    attributes:
      name: responsesSeparator

  - type: textBlock
    attributes:
      description: 'OpenAI Responses profile: POST /responses · Authorization: Bearer'

  - type: input
    attributes:
      name: responsesAlias
      label: Profile alias
      description: 'One word, up to 32 characters. Do not use spaces, @, or >.'
      defaultValue: responses

  - type: input
    attributes:
      name: responsesBaseUrl
      label: Base URL
      description: 'Defaults to https://api.openai.com/v1. /responses is appended only when needed.'
      defaultValue: https://api.openai.com/v1

  - type: passwordBox
    attributes:
      name: responsesApiKey
      label: API key
      description: Stored in Flow Launcher settings. If empty, a query shows a setup prompt.
      defaultValue: ""

  - type: input
    attributes:
      name: responsesModel
      label: Model ID
      description: Enter a model ID supported by your provider.
      defaultValue: ""

  - type: separator
    attributes:
      name: claudeSeparator

  - type: textBlock
    attributes:
      description: 'Claude Messages profile: POST /messages · x-api-key'

  - type: input
    attributes:
      name: claudeAlias
      label: Profile alias
      description: 'One word, up to 32 characters. Do not use spaces, @, or >.'
      defaultValue: claude

  - type: input
    attributes:
      name: claudeBaseUrl
      label: Base URL
      description: 'Defaults to https://api.anthropic.com/v1. /messages is appended only when needed.'
      defaultValue: https://api.anthropic.com/v1

  - type: passwordBox
    attributes:
      name: claudeApiKey
      label: API key
      description: Stored in Flow Launcher settings. If empty, a query shows a setup prompt.
      defaultValue: ""

  - type: input
    attributes:
      name: claudeModel
      label: Model ID
      description: Enter a model ID supported by your provider.
      defaultValue: ""

  - type: separator
    attributes:
      name: footerSeparator

  - type: textBlock
    attributes:
      description: API keys are never written to logs, search results, or the language state file.
