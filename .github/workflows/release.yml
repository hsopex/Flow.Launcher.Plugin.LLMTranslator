name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package plugin
        shell: pwsh
        run: ./scripts/package.ps1 -OutputDirectory . -VersionLabel "${{ github.ref_name }}"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "Flow.Launcher.Plugin.LLMTranslator-${{ github.ref_name }}.zip" --generate-notes
